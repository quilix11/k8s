apiVersion: apps/v1
kind: Deployment 
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: db-image
          ports:
            - containerPort: 5432
          volumeMounts:
            - name:  db-stoerage
              mountPath:  /var/lib/postgresql/data
          
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

      volumes:
        - name:  db-stoerage
          persistentVolumeClaim:
            claimName: db-pvc
        